name: CloudSeed Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 运行测试
        run: npm test
      - name: 构建前后端
        run: npm run build
      - name: 校验 Docker Compose 配置
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet

  docker:
    name: 构建并推送镜像
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 设置镜像名称
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: 启用 ARM64 构建
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: 构建 AMD64 与 ARM64 镜像
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=cloudseed
          cache-to: type=gha,mode=max,scope=cloudseed
      - name: 验证容器启动与登录
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          admin_password="$(openssl rand -hex 24)"
          echo "::add-mask::$admin_password"
          docker run -d --name cloudseed \
            --health-interval=2s --health-start-period=2s \
            -p 127.0.0.1:3180:3180 \
            -e CLOUDSEED_ADMIN_USERNAME=admin \
            -e CLOUDSEED_ADMIN_PASSWORD="$admin_password" \
            "$IMAGE_REF"
          ready=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' cloudseed)" = healthy ]; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:3180/ | grep -q '<title>CloudSeed</title>'
          docker exec -i cloudseed node --input-type=module <<'NODE'
          const origin = "http://127.0.0.1:3180";
          const login = await fetch(`${origin}/api/auth/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CloudSeed-Request": "1",
              Origin: origin,
            },
            body: JSON.stringify({
              username: process.env.CLOUDSEED_ADMIN_USERNAME,
              password: process.env.CLOUDSEED_ADMIN_PASSWORD,
            }),
          });
          if (!login.ok) throw new Error(`登录失败 ${login.status}`);
          const cookie = login.headers.get("set-cookie")?.split(";")[0];
          if (!cookie) throw new Error("登录未创建会话");
          const response = await fetch(`${origin}/api/auth/status`, { headers: { Cookie: cookie } });
          const status = await response.json();
          if (!response.ok || !status.authenticated || status.username !== "admin") {
            throw new Error("会话验证失败");
          }
          console.log("CloudSeed 容器健康检查与登录验证通过");
          NODE
      - name: 输出失败日志
        if: failure()
        run: docker logs cloudseed 2>&1 || true
      - name: 清理验证容器
        if: always()
        run: docker rm -f cloudseed 2>/dev/null || true
